[workspace]
resolver = "3"
members = ["crates/beeline", "crates/viewer"]
# `cargo run` starts the viewer; `cargo test` covers both crates
default-members = ["crates/beeline", "crates/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alex-quiterio/beeline"

[workspace.dependencies]
# glam must match the version macroquad re-exports, so library and viewer share one Vec3 type
glam = "0.27"
